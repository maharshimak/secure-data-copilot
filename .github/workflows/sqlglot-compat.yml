name: SQLGlot authorization compatibility

on:
  pull_request:
    paths:
      - 'src/data_copilot/access.py'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/sqlglot-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sqlglot: ['29.*', '30.*']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Override SQLGlot only for compatibility verification
        run: |
          python -m pip install --no-deps 'sqlglot==${{ matrix.sqlglot }}'
          python -c "import sqlglot; print('SQLGlot version:', sqlglot.__version__)"
      - name: Run complete test suite with selected parser
        run: python -m pytest -q
